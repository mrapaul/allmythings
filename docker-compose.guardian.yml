version: '3.9'

services:
  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: guardian-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233" # gRPC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visual-inventory-network
    restart: unless-stopped

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: guardian-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    networks:
      - visual-inventory-network
    restart: unless-stopped

  # Guardian Service
  guardian:
    build:
      context: ./guardian-service
      dockerfile: Dockerfile
    container_name: guardian-service
    environment:
      - TEMPORAL_HOST=temporal:7233
      - PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      - temporal
    networks:
      - visual-inventory-network
    restart: unless-stopped

# Link to existing networks/volumes from main docker-compose
networks:
  visual-inventory-network:
    external: true
