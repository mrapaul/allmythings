# Qwen3-VL LoRA fine-tune (ms-swift 4.x) — 1x A100/H100 80GB.
# Hyperparams follow the official ms-swift Qwen3-VL best-practice recipe
# (lora r=8 a=32, lr 1e-4, freeze_vit, packing, bf16).
model: Qwen/Qwen3-VL-8B-Instruct   # swap to Qwen/Qwen3-VL-4B-Instruct for the small track
dataset: training/data/vlm/train.jsonl
val_dataset: training/data/vlm/val.jsonl
output_dir: training/output/vlm_lora

tuner_type: lora
lora_rank: 8
lora_alpha: 32
learning_rate: 1.0e-4
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
torch_dtype: bfloat16
freeze_vit: true
freeze_aligner: true
packing: true
attn_impl: flash_attn
max_length: 8192
warmup_ratio: 0.05
save_steps: 200
eval_steps: 200
logging_steps: 10
save_total_limit: 3

env:
  IMAGE_MAX_TOKEN_NUM: "1024"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

# Extra raw CLI args passed through to `swift sft` verbatim.
extra_args: []
