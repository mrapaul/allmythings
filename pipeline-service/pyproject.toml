[project]
name = "pipeline-service"
version = "0.1.0"
description = "Visual Home Inventory — Dagster pipeline service (Apple Silicon, in-process)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "dagster>=1.9,<2.0",
    "dagster-webserver>=1.9,<2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "Pillow>=10.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "pytest-mock>=3.14",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:dagster.*",
    "ignore::PendingDeprecationWarning",
]

[tool.uv]
package = true
