# Prometheus Configuration for Visual Home Inventory Manager
# Monitors API service, database, and infrastructure components

global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'visual-inventory-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # API Service metrics (OpenTelemetry)
  - job_name: 'visual-inventory-api'
    static_configs:
      - targets:
          - 'api:9464' # Prometheus exporter port
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-service'
    metric_relabel_configs:
      # Drop high-cardinality metrics
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-host'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-db'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-cache'

  # Jaeger metrics (tracing backend)
  - job_name: 'jaeger'
    static_configs:
      - targets:
          - 'jaeger:14269'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'
    metrics_path: '/metrics'

# Remote write configuration (for long-term storage)
# Uncomment if using remote storage like Prometheus Cloud, Grafana Cloud, etc.
# remote_write:
#   - url: 'https://prometheus-us-central1.grafana.net/api/prom/push'
#     basic_auth:
#       username: 'your-username'
#       password: 'your-api-key'

# Storage configuration
storage:
  tsdb:
    retention.time: 30d # Keep 30 days of data locally
    retention.size: 10GB # Maximum storage size
