global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m
  receiver: macos-notifier
  routes:
    - matchers:
        - severity="critical"
      receiver: macos-notifier
      repeat_interval: 10m

receivers:
  - name: macos-notifier
    webhook_configs:
      - url: http://host.docker.internal:18080/notify
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
