# Local observability + orchestration stack for allmythings.
# Brought up by `make start-deps`. Fully local, OSS.
services:
  temporal-db:
    image: postgres:15-alpine
    container_name: allmythings-temporal-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes: [temporal-pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: allmythings-temporal
    restart: unless-stopped
    # DB=sqlite was removed from auto-setup (valid: mysql8, postgres12,
    # postgres12_pgx, cassandra) — 1.24.2 crash-looped on it since the stack
    # was added. Postgres backend added 2026-09-19; the old sqlite volume
    # (temporal-data) never contained a database and is no longer used.
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=temporal-db
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      # Do NOT set TEMPORAL_ADDRESS here: the server then binds to the eth0
      # IP only, the in-container wait loop (dialing 127.0.0.1/0.0.0.0) never
      # succeeds, and the default namespace is never registered. Default bind
      # is all interfaces.
      - LOG_LEVEL=info
      - PROMETHEUS_ENDPOINT=0.0.0.0:9090
    ports: ["7233:7233", "7243:7243"]

  temporal-ui:
    image: temporalio/ui:2.30.3
    container_name: allmythings-temporal-ui
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports: ["8233:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: allmythings-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes: [./otel-collector:/etc/otel-collector]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: allmythings-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo:/etc/tempo
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.1.1
    container_name: allmythings-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki:/etc/loki
      - loki-data:/tmp/loki
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.1.1
    container_name: allmythings-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/allmythings-data:/host-data:ro
      - /tmp/allmythings:/tmp/allmythings:ro
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: allmythings-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    volumes:
      - ./prometheus:/etc/prometheus
      - prom-data:/prometheus
    ports: ["9191:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: allmythings-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, prometheus]
    ports: ["3000:3000"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: allmythings-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    ports: ["9093:9093"]

volumes:
  temporal-pg-data: {}
  tempo-data: {}
  loki-data: {}
  prom-data: {}
  grafana-data: {}
  alertmanager-data: {}
