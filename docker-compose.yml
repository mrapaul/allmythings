services:
  # API Service (Node.js/Fastify)
  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: inventory-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 14000
      API_KEY: ${API_KEY:-}

      # Detection Service
      DETECTION_SERVICE_URL: http://detection:14001

      # Gemini (primary classifier)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}

      # Ollama (fallback classifier)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-vl:7b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}

      # Database
      DATABASE_URL: ${DATABASE_URL:-postgresql://allmythings:allmythings@db:5432/allmythings}
    ports:
      - "${API_PORT:-14000}:14000"
    depends_on:
      detection:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Detection Service (Python/FastAPI - Grounding DINO)
  detection:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: inventory-detection
    environment:
      MODEL_ID: ${DETECTION_MODEL_ID:-IDEA-Research/grounding-dino-tiny}
      DEVICE: ${DETECTION_DEVICE:-cpu}
      PORT: 14001
    ports:
      - "${DETECTION_PORT:-14001}:14001"
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ollama (optional - for local LLM classification)
  ollama:
    image: ollama/ollama:latest
    container_name: inventory-ollama
    # ports:
    #   - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - inventory-network
    profiles:
      - local-llm

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allmythings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allmythings}
      POSTGRES_DB: ${POSTGRES_DB:-allmythings}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allmythings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local

networks:
  inventory-network:
    driver: bridge
