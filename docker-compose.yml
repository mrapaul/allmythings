services:
  # API Service (Node.js/Fastify)
  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: inventory-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      API_KEY: ${API_KEY:-}

      # Detection Service
      DETECTION_SERVICE_URL: http://detection:8001

      # Gemini (primary classifier)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro-preview-06-05}

      # Ollama (fallback classifier)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava:13b}

      # Google Vision (fallback detector)
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      GOOGLE_CREDENTIALS: ${GOOGLE_CREDENTIALS:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      detection:
        condition: service_started
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Detection Service (Python/FastAPI - Grounding DINO)
  detection:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: inventory-detection
    environment:
      MODEL_ID: ${DETECTION_MODEL_ID:-IDEA-Research/grounding-dino-tiny}
      DEVICE: ${DETECTION_DEVICE:-cpu}
    ports:
      - "${DETECTION_PORT:-8001}:8001"
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ollama (optional - for local LLM classification)
  ollama:
    image: ollama/ollama:latest
    container_name: inventory-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - inventory-network
    profiles:
      - local-llm

volumes:
  ollama_data:
    driver: local

networks:
  inventory-network:
    driver: bridge
