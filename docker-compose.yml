version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: visual-inventory-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-visual_inventory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: >
        --locale=en_US.UTF-8
        --encoding=UTF8
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/migrations:/migrations
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-visual_inventory}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-inventory-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: visual-inventory-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-inventory-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # API Service
  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile
      target: runtime
    container_name: visual-inventory-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-visual_inventory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # S3 / Storage
      S3_BASE_URL: ${S3_BASE_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-inventory-photos}
      S3_REGION: ${S3_REGION:-us-east-1}

      # Google Cloud Vision
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}

      # AWS Rekognition
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # Ensemble Configuration
      ENSEMBLE_CONFIDENCE_THRESHOLD: ${ENSEMBLE_CONFIDENCE_THRESHOLD:-0.7}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-4000}
      NMS_IOU_THRESHOLD: ${NMS_IOU_THRESHOLD:-0.5}

      # Provider Weights
      META_WEIGHT: ${META_WEIGHT:-0.30}
      GOOGLE_WEIGHT: ${GOOGLE_WEIGHT:-0.30}
      AWS_WEIGHT: ${AWS_WEIGHT:-0.25}
      TENSORFLOW_WEIGHT: ${TENSORFLOW_WEIGHT:-0.15}

    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api-service/src:/app/src:cached
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visual-inventory-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/v1/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # MinIO S3-compatible Storage (Optional for development)
  minio:
    image: minio/minio:latest
    container_name: visual-inventory-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_root/data
    command: server /minio_root/data --console-address ":9001"
    networks:
      - visual-inventory-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  visual-inventory-network:
    driver: bridge
