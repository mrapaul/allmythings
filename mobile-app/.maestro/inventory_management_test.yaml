# Inventory Management Test - Browse, search, and edit inventory items
# Tags: inventory, regression
appId: allmythings

---
# Launch the app
- launchApp

# Wait for the app to fully load
- waitForAnimationToEnd:
    timeout: 5000

# Verify we're on inventory screen
- takeScreenshot: inventory_initial

# Check for inventory feed/grid
- assertVisible:
    text: "Inventory"
    optional: true

# Scroll down to load more items
- scroll:
    direction: DOWN
    distance: 300

- waitForAnimationToEnd:
    timeout: 2000

# Take screenshot of scrolled view
- takeScreenshot: inventory_scrolled

# Scroll back up
- scroll:
    direction: UP
    distance: 300

# Look for search functionality
- tapOn:
    id: "search_button"
    optional: true

- tapOn:
    id: "search_icon"
    optional: true

- tapOn:
    text: "Search"
    optional: true

- waitForAnimationToEnd:
    timeout: 1000

# Take screenshot of search screen
- takeScreenshot: inventory_search

# Try searching for common items
- inputText: "couch"

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: inventory_search_results

# Clear search
- clearText

# Try another search
- inputText: "table"

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: inventory_search_table

# Go back to main inventory
- back

- waitForAnimationToEnd:
    timeout: 1000

# Try tapping on first item
- tapOn:
    index: 0
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# Take screenshot of item detail
- takeScreenshot: inventory_item_detail

# Look for edit functionality
- tapOn:
    text: "Edit"
    optional: true

- tapOn:
    id: "edit_button"
    optional: true

- waitForAnimationToEnd:
    timeout: 1000

# Take screenshot of edit screen
- takeScreenshot: inventory_item_edit

# Go back
- back

- waitForAnimationToEnd

# Final screenshot
- takeScreenshot: inventory_test_complete
