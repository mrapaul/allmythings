appId: allmythings
---
# T051 [P] [US1] E2E test for camera capture and detection workflow
#
# Purpose: Validate complete user journey from app launch to viewing saved item
#
# Success Criteria:
# - Launch app successfully
# - Navigate to camera screen
# - Capture photo
# - View detection results
# - Save item to inventory
# - View item in feed
# - Search for item
# - View item details

- launchApp:
    clearState: true

# Verify app launched and home screen visible
- assertVisible: "Home Inventory"

# Initial state: empty inventory
- assertVisible: "No Items Yet"
- assertVisible:
    id: "camera_button"

# Step 1: Navigate to camera
- tapOn:
    id: "camera_button"

# Grant camera permission (first launch)
- runFlow:
    when:
      visible: "Camera Permission Required"
    commands:
      - tapOn: "Grant Permission"
      - tapOn: "Allow"  # System permission dialog

# Verify camera screen opened
- assertVisible:
    id: "camera_preview"
- assertVisible:
    id: "capture_button"

# Step 2: Capture photo
- tapOn:
    id: "capture_button"

# Wait for API detection (max 15 seconds)
- waitForAnimationToEnd:
    timeout: 15000

# Step 3: Verify detection results screen
- assertVisible: "Detection Results"
- assertVisible: "Detected Objects"

# Verify at least one detection displayed
- assertVisible:
    id: "detection_card"

# Verify ensemble metrics displayed
- assertVisible: "Provider Agreement"

# Step 4: Save detections
- tapOn:
    id: "done_button"

# Wait for navigation back to home
- waitForAnimationToEnd

# Step 5: Verify item appears in feed
- assertVisible:
    id: "inventory_grid"
- assertVisible:
    id: "inventory_card"

# Verify empty state no longer shown
- assertNotVisible: "No Items Yet"

# Step 6: Tap item to view details
- tapOn:
    id: "inventory_card"

# Verify item detail screen
- assertVisible: "Item Details"
- assertVisible:
    id: "item_photo"
- assertVisible:
    id: "labels_section"

# Verify detection metadata
- assertVisible: "Confidence"
- assertVisible: "Provider Agreement"

# Go back to feed
- tapOn:
    id: "back_button"

# Step 7: Test search functionality
- tapOn:
    id: "search_tab"

# Verify search screen
- assertVisible:
    id: "search_field"

# Get the detected label from the item (assume "Laptop" for example)
- inputText:
    text: "Laptop"
    id: "search_field"

# Wait for search results
- waitForAnimationToEnd

# Verify search results
- assertVisible:
    id: "search_results_grid"
- assertVisible:
    id: "inventory_card"

# Tap search result
- tapOn:
    id: "inventory_card"

# Verify same item details screen
- assertVisible: "Item Details"

# Go back to search
- tapOn:
    id: "back_button"

# Clear search
- tapOn:
    id: "clear_search_button"

# Step 8: Navigate to Profile
- tapOn:
    id: "profile_tab"

# Verify profile screen
- assertVisible: "My Inventory"
- assertVisible: "Total Items"
- assertVisible: "1"  # One item captured

# Step 9: Test second capture (multi-item scenario)
- tapOn:
    id: "home_tab"
- tapOn:
    id: "camera_button"

# Capture second item
- tapOn:
    id: "capture_button"
- waitForAnimationToEnd:
    timeout: 15000

# Verify second detection
- assertVisible: "Detection Results"

# Save second item
- tapOn:
    id: "done_button"
- waitForAnimationToEnd

# Verify 2 items in feed
- assertVisible:
    count: 2
    id: "inventory_card"

# Step 10: Test pull-to-refresh
- scroll:
    direction: DOWN
    startPoint: 50%,20%

- waitForAnimationToEnd

# Verify feed refreshed (still 2 items)
- assertVisible:
    count: 2
    id: "inventory_card"

# Step 11: Test edit labels
- tapOn:
    id: "inventory_card"
    index: 0

# Open edit labels
- tapOn:
    id: "edit_labels_button"

# Add custom label
- tapOn:
    id: "add_label_button"

- inputText:
    text: "Color"
    id: "label_key_field"

- inputText:
    text: "Black"
    id: "label_value_field"

- tapOn:
    id: "save_label_button"

# Verify label added
- assertVisible: "Color: Black"

# Go back
- tapOn:
    id: "back_button"

# Step 12: Search by custom label
- tapOn:
    id: "search_tab"

- inputText:
    text: "Black"
    id: "search_field"

- waitForAnimationToEnd

# Verify item found by custom label
- assertVisible:
    id: "inventory_card"

# Step 13: Test delete item
- tapOn:
    id: "inventory_card"

- tapOn:
    id: "delete_button"

# Confirm delete
- tapOn: "Delete"

- waitForAnimationToEnd

# Verify back to search screen
- assertVisible:
    id: "search_field"

# Go to home
- tapOn:
    id: "home_tab"

# Verify only 1 item remaining
- assertVisible:
    count: 1
    id: "inventory_card"

# Step 14: Test offline resilience (airplane mode)
- evalScript: ${device.airplaneMode.enable()}

# Navigate and verify UI still works
- tapOn:
    id: "search_tab"
- tapOn:
    id: "profile_tab"
- tapOn:
    id: "home_tab"

# All tabs should still render (offline-first)
- assertVisible:
    id: "inventory_grid"

# Disable airplane mode
- evalScript: ${device.airplaneMode.disable()}

# Final verification: Complete workflow test passed
- assertVisible:
    id: "inventory_card"

# Success: E2E test completed
- stopApp
