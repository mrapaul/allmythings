appId: allmythings
---
# Smoke test for Slick UI and Background Detection
- launchApp:
    clearState: true

# 1. Home Screen Verification
- assertVisible: "visual_vault"
- assertVisible: "items"
- assertVisible: "labels"

# 2. Start Capture Workflow
- tapOn:
    id: "add-item-nav"

# 3. Simulated Shutter
- tapOn:
    id: "shutter-button"

# 4. Preview and Continue
- assertVisible: "Continue"
- tapOn: "Continue"

# 5. Immediate Background Return
- assertVisible: "visual_vault"
- assertVisible: "IDENTIFYING"

# 6. Wait for Mock AI results (Mock AI takes ~1.5s + network)
- waitForAnimationToEnd:
    timeout: 10000

# 7. Success Verification
- assertNotVisible: "IDENTIFYING"
- tapOn:
    index: 0 # Tap the first grid item (the one we just processed)

# 8. Visual Identification Screen
- assertVisible: "Visual Identification"
- assertVisible: "Yellow Upholstered Armchair"
- assertVisible: "Modern Gold Floor Lamp"

# 9. Edit Workflow
- tapOn: "EDIT"
- assertVisible: "Edit Labels"
- tapOn: "VAULT ITEMS"

# 10. Final check
- assertVisible: "visual_vault"
