appId: com.codesparktech.homeinventory
tags:
  - smoke
---
# Smallest happy-path flow: launch the app on a clean install and confirm
# the empty-state lands, then tap the camera capsule to navigate to the
# detection screen. No items, no homes added, no permissions granted.

- launchApp:
    clearState: true

# Empty home: the headline copy is a stable text landmark on the index route.
- assertVisible: "A blank canvas"

# The "Tap the camera below" line confirms the empty-state CTA is rendered.
# Maestro full-matches the regex against the element text, so the prefix
# alone never matched — anchor it with a wildcard tail.
- assertVisible:
    text: "Tap the camera below.*"

# The action capsule's primary button has a stable testID added in
# components/ActionCapsule.tsx for E2E targeting.
- tapOn:
    id: "action-capsule-camera"

# The camera button now opens our OWN viewfinder (app/capture.tsx) rather
# than the system camera sheet, so the app stays in-process and we can
# assert on it. `capture-close` is present in both states the screen can be
# in — the live viewfinder and the "Allow camera" prompt shown when the
# permission has not been granted — which keeps this robust on a simulator
# with no camera and no pre-granted permission.
- extendedWaitUntil:
    visible:
      id: "capture-close"
    timeout: 15000
- tapOn:
    id: "capture-close"

# Dismissing the viewfinder returns to the empty collection.
- assertVisible: "A blank canvas"
