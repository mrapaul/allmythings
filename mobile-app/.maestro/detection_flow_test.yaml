# Detection Flow Test - Complete detection and save workflow
# Tags: detection, regression
appId: allmythings

---
# Launch the app
- launchApp

# Wait for the app to fully load
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to camera
- tapOn:
    text: "Camera"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Take screenshot before capture
- takeScreenshot: detection_camera_ready

# Grant camera permission if prompted
- tapOn:
    text: "Allow"
    optional: true

# Wait for camera to initialize
- waitForAnimationToEnd:
    timeout: 5000

# Tap capture button (looking for common icons/labels)
- tapOn:
    id: "capture_button"
    optional: true

# Or tap on camera shutter area
- tapOn:
    text: "Capture"
    optional: true

# Wait for detection to complete
- waitForAnimationToEnd:
    timeout: 10000

# Take screenshot of detection results
- takeScreenshot: detection_results

# Verify detection results are visible
- assertVisible:
    text: "Detection"
    optional: true

# Try to select an object if present
- tapOn:
    text: "couch"
    optional: true

- tapOn:
    text: "chair"
    optional: true

- tapOn:
    text: "table"
    optional: true

# Wait for any object selection animation
- waitForAnimationToEnd:
    timeout: 2000

# Take screenshot of selected object
- takeScreenshot: detection_object_selected

# Look for save button
- tapOn:
    text: "Save"
    optional: true

- tapOn:
    text: "Add to Inventory"
    optional: true

# Wait for save confirmation
- waitForAnimationToEnd:
    timeout: 3000

# Take final screenshot
- takeScreenshot: detection_saved
