# Maestro configuration for the RN/Expo Home Inventory app.
#
# `appId` matches `expo.ios.bundleIdentifier` / `expo.android.package` from
# `app.json` so `maestro test` resolves the running build automatically.

appId: com.codesparktech.homeinventory

flows:
  - "*.yaml"

screenshots:
  enabled: true
  format: png

timeout: 30000
retries: 1

tags:
  - smoke
  - regression
