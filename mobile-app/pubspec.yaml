name: home_inventory
description: "Visual Home Inventory Manager - Camera-based object detection and inventory tracking"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Database (SQLite + ORM)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.8.3

  # HTTP Client
  dio: ^5.4.0

  # Navigation
  go_router: ^13.0.1

  # Code Generation (Models)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Functional Programming
  fpdart: ^1.1.0

  # Camera & Images
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  image: ^4.1.3

  # Hooks
  flutter_hooks: ^0.20.4
  hooks_riverpod: ^2.4.9

  # UI
  cupertino_icons: ^1.0.8

  # Permissions
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^5.1.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  drift_dev: ^2.14.1

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
