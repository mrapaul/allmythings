name: all_my_things
description: "A minimalistic, resilient, fully functional home inventory app with Instagram-style UI and AI-powered object detection."
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  cached_network_image: any
  camera: ^0.12.0
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  drift: ^2.31.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_markdown: ^0.7.7+1
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.0.3
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.0.0
  hooks_riverpod: ^3.0.3
  image: ^4.1.3
  image_picker: ^1.2.0
  json_annotation: ^4.11.0
  logging: any
  path: ^1.8.3
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  riverpod: any
  shared_preferences: any
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build: any
  build_runner: ^2.4.0
  drift_dev: any
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mockito: any
  mocktail: any
  riverpod_generator: any
  source_gen: any
  very_good_analysis: ^10.0.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter_native_splash:
  color: "#3f51b5"
  image: "assets/images/app_icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/test_images/
    - assets/images/
    - assets/legal/
