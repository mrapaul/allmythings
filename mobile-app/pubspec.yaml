name: all_my_things
description: "A minimalistic, resilient, fully functional home inventory app with Instagram-style UI and AI-powered object detection."
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Database (SQLite + ORM)
  drift: any
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.8.3

  # HTTP Client
  dio: ^5.4.0

  # Navigation
  go_router: ^16.3.0

  # Code Generation (Models)
  freezed_annotation: ^3.1.0

  # Functional Programming
  fpdart: ^1.1.0

  # Camera & Images
  camera: ^0.11.3
  image_picker: ^1.0.7
  image: ^4.1.3

  # Hooks
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.0.3

  # UI
  cupertino_icons: ^1.0.8

  # Permissions
  permission_handler: ^12.0.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^10.0.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3
  drift_dev: any

  # Testing
  mockito: ^5.4.6
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
