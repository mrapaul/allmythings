name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'api-service/openapi.json'
  pull_request:
    paths:
      - 'mobile-app/**'
      - 'api-service/openapi.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile-app/pnpm-lock.yaml
      - name: Install mobile
        run: |
          cd mobile-app
          pnpm install --frozen-lockfile
      - name: Verify openapi.json is current
        # api-service uses npm (not pnpm) - `npm ci` is the strict-lockfile
        # equivalent. Re-run the export and fail fast if openapi.json drifts.
        run: |
          cd api-service
          npm ci
          npm run export:openapi
          git diff --exit-code openapi.json || (echo "openapi.json is stale; run 'npm run export:openapi' in api-service" && exit 1)
      - name: Codegen mobile types
        run: |
          cd mobile-app
          pnpm codegen:api
      - name: Lint
        run: cd mobile-app && pnpm lint
      - name: Typecheck
        run: cd mobile-app && pnpm typecheck
      - name: Unit tests
        run: cd mobile-app && pnpm test
