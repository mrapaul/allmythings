name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9' # Specify a precise Flutter version
          channel: 'stable'
          architecture: 'arm64' # Explicitly set architecture for M-series Macs

      - name: Install dependencies
        run: | 
          cd mobile-app
          flutter pub get

      - name: Run code generation
        run: | 
          cd mobile-app
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter analysis
        run: | 
          cd mobile-app
          flutter analyze

      - name: Run unit tests
        run: | 
          cd mobile-app
          flutter test

      - name: Run integration tests (Web Headless)
        run: | 
          cd mobile-app
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/home_interior_regression_test.dart --browser-name=chrome

      - name: Build Android APK
        run: | 
          cd mobile-app
          flutter build apk

      - name: Build iOS (no codesign)
        run: | 
          cd mobile-app
          flutter build ios --no-codesign
