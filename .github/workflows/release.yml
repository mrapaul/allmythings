name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: '20.x'
  FLUTTER_VERSION: '3.35.6'

jobs:
  # ============================================
  # CREATE RELEASE
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### macOS
            Download `home_inventory.dmg` and drag to Applications

            ### iOS
            Download `home_inventory.ipa` (requires TestFlight or enterprise cert)

            ### Android
            Download `app-release.apk` for direct install
            Download `app-release.aab` for Play Store

            ## API Service
            Download `api-dist.zip` and deploy to your server

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_version.outputs.previous_tag }}...v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false

  # ============================================
  # BUILD AND UPLOAD ASSETS
  # ============================================
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build macOS
        working-directory: mobile-app
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build macos --release

      - name: Create DMG
        working-directory: mobile-app/build/macos/Build/Products/Release
        run: |
          hdiutil create -volname "Home Inventory" -srcfolder home_inventory.app -ov -format UDZO home_inventory.dmg

      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/build/macos/Build/Products/Release/home_inventory.dmg
          asset_name: home_inventory_${{ needs.create-release.outputs.version }}_macos.dmg
          asset_content_type: application/octet-stream

  build-ios:
    name: Build iOS Release
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build iOS
        working-directory: mobile-app
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build ios --release --no-codesign

      - name: Create IPA
        working-directory: mobile-app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r home_inventory.ipa Payload

      - name: Upload iOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/build/ios/iphoneos/home_inventory.ipa
          asset_name: home_inventory_${{ needs.create-release.outputs.version }}_ios.ipa
          asset_content_type: application/octet-stream

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build Android
        working-directory: mobile-app
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          asset_name: home_inventory_${{ needs.create-release.outputs.version }}_android.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Android Bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/build/app/outputs/bundle/release/app-release.aab
          asset_name: home_inventory_${{ needs.create-release.outputs.version }}_android.aab
          asset_content_type: application/octet-stream

  build-api:
    name: Build API Release
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build API
        working-directory: api-service
        run: |
          npm ci
          npm run build
          zip -r api-dist.zip dist/ package.json package-lock.json

      - name: Upload API Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: api-service/api-dist.zip
          asset_name: api-service_${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip
