name: E2E Regression Tests - Appium

on:
  push:
    branches: [develop, main, feature/**]
    paths:
      - 'mobile-app/**'
      - 'api-service/**'
      - '.github/workflows/e2e-regression-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile-app/**'
      - 'api-service/**'
      - '.github/workflows/e2e-regression-tests.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.16.0'
  NODE_VERSION: '20'

jobs:
  # Prepare test environment
  setup:
    name: Setup E2E Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      api-ready: ${{ steps.api-check.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api-service/package-lock.json

      - name: Install API dependencies
        working-directory: api-service
        run: npm ci

      - name: Build API
        working-directory: api-service
        run: npm run build

      - name: Start API server in background
        working-directory: api-service
        run: |
          npm run dev > api-server.log 2>&1 &
          sleep 10
          curl -s http://localhost:14000/v1/health || echo "API not ready yet"

      - name: Check API health
        id: api-check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:14000/v1/health | grep -q "healthy"; then
              echo "status=ready" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 2
          done
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Upload API logs if failed
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: api-server-logs
          path: api-service/api-server.log

  # Unit and functional tests
  unit-functional-tests:
    name: Unit & Functional Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Generate code
        working-directory: mobile-app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        working-directory: mobile-app
        run: flutter test test/domain/

      - name: Run functional tests
        working-directory: mobile-app
        run: flutter test test/data/

      - name: Run provider tests
        working-directory: mobile-app
        run: flutter test test/application/providers/

      - name: Generate coverage
        working-directory: mobile-app
        run: flutter test --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-functional-test-results
          path: mobile-app/coverage/

  # Build for E2E testing
  build-for-e2e:
    name: Build App for E2E Testing
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [setup]
    outputs:
      build-success: ${{ steps.build-check.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Generate code
        working-directory: mobile-app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS for testing
        id: build-check
        working-directory: mobile-app
        run: |
          flutter build ios --simulator --release 2>&1 | tee build.log
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: flutter-ios-build
          path: mobile-app/build/ios/iphonesimulator/Runner.app/
          retention-days: 1

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: flutter-build-logs
          path: mobile-app/build.log

  # E2E tests with Appium (iOS)
  e2e-ios:
    name: E2E Tests - iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [setup, unit-functional-tests, build-for-e2e]
    if: needs.setup.outputs.api-ready == 'ready'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium
        run: |
          npm install -g appium appium-doctor
          appium-doctor --ios

      - name: Start API server
        working-directory: api-service
        run: |
          npm install
          npm run dev > api-server.log 2>&1 &
          sleep 10

      - name: Start iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          sleep 10

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Flutter app for iOS
        working-directory: mobile-app
        run: flutter build ios --simulator

      - name: Start Appium server
        run: |
          appium --port 4723 --allow-insecure chromedriver_autodownload > appium.log 2>&1 &
          sleep 5

      - name: Run E2E tests
        working-directory: mobile-app
        run: |
          chmod +x test_driver/run_e2e_tests.sh
          ./test_driver/run_e2e_tests.sh ios 2>&1 | tee e2e-results.log

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-ios-results
          path: |
            mobile-app/e2e-results.log
            mobile-app/test_reports/
          retention-days: 7

      - name: Upload Appium logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: appium-ios-logs
          path: appium.log

  # E2E tests with Appium (Android)
  e2e-android:
    name: E2E Tests - Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [setup, unit-functional-tests, build-for-e2e]
    if: needs.setup.outputs.api-ready == 'ready'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium
        run: |
          npm install -g appium appium-doctor
          appium-doctor --android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34

      - name: Create Android emulator
        run: |
          $ANDROID_SDK_ROOT/emulator/emulator -list-avds || true
          echo "no" | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --install "system-images;android;34;google_apis;x86_64"
          echo "no" | $ANDROID_SDK_ROOT/tools/bin/avdmanager create avd -n test_device -k "system-images;android;34;google_apis;x86_64" -f
          $ANDROID_SDK_ROOT/emulator/emulator -avd test_device -no-snapshot-load > emulator.log 2>&1 &
          sleep 30

      - name: Start API server
        working-directory: api-service
        run: |
          npm install
          npm run dev > api-server.log 2>&1 &
          sleep 10

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Flutter app for Android
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Start Appium server
        run: |
          appium --port 4723 --allow-insecure chromedriver_autodownload > appium.log 2>&1 &
          sleep 5

      - name: Run E2E tests
        working-directory: mobile-app
        run: |
          chmod +x test_driver/run_e2e_tests.sh
          ./test_driver/run_e2e_tests.sh android 2>&1 | tee e2e-results.log

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-android-results
          path: |
            mobile-app/e2e-results.log
            mobile-app/test_reports/
          retention-days: 7

      - name: Upload Appium logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: appium-android-logs
          path: appium.log

  # Test summary and reporting
  test-summary:
    name: Test Summary & Report
    runs-on: ubuntu-latest
    needs: [setup, unit-functional-tests, e2e-ios, e2e-android]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v3
        with:
          path: test-results/

      - name: Generate test report
        run: |
          echo "# E2E Regression Test Report" > test-report.md
          echo "" >> test-report.md
          echo "## Test Execution Summary" >> test-report.md
          echo "- **Setup**: ${{ needs.setup.result }}" >> test-report.md
          echo "- **Unit & Functional Tests**: ${{ needs.unit-functional-tests.result }}" >> test-report.md
          echo "- **E2E iOS Tests**: ${{ needs.e2e-ios.result }}" >> test-report.md
          echo "- **E2E Android Tests**: ${{ needs.e2e-android.result }}" >> test-report.md
          echo "" >> test-report.md
          echo "## Results" >> test-report.md
          if [ -f "test-results/unit-functional-test-results/index.html" ]; then
            echo "- Coverage report generated ✅" >> test-report.md
          fi
          if [ -f "test-results/e2e-ios-results/test_reports/index.html" ]; then
            echo "- iOS E2E report generated ✅" >> test-report.md
          fi
          if [ -f "test-results/e2e-android-results/test_reports/index.html" ]; then
            echo "- Android E2E report generated ✅" >> test-report.md
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: test-summary-report
          path: test-report.md

      - name: Fail if tests failed
        if: |
          needs.setup.result == 'failure' ||
          needs.unit-functional-tests.result == 'failure' ||
          needs.e2e-ios.result == 'failure' ||
          needs.e2e-android.result == 'failure'
        run: exit 1

      - name: Success
        if: success()
        run: echo "All E2E regression tests passed!"
