name: Flutter Production Build & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: cd mobile-app && flutter pub get
      
      - name: Build AAB
        run: cd mobile-app && flutter build appbundle --release
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile-app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: cd mobile-app && flutter pub get
      
      - name: Build IPA
        run: |
          cd mobile-app
          flutter build ios --release --no-codesign
          # Note: Full IPA creation usually requires codesigning certificates
          # This build verifies the project compiles correctly for iOS.
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile-app/build/ios/iphoneos/Runner.app
