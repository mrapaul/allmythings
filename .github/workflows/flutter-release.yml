name: Flutter Production Build & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: cd mobile-app && flutter pub get
      
      - name: Build AAB
        run: cd mobile-app && flutter build appbundle --release
      
      - name: Distribute to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute mobile-app/build/app/outputs/bundle/release/app-release.aab --app ${{ secrets.FIREBASE_APP_ID }} --groups "internal-testers"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile-app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: cd mobile-app && flutter pub get
      
      - name: Build IPA
        run: |
          cd mobile-app
          flutter build ios --release --no-codesign
      
      - name: Distribute to TestFlight (Placeholder)
        run: |
          echo "TestFlight distribution requires codesigning and App Store Connect credentials."
          echo "Typical command: xcrun altool --upload-app -f build/ios/ipa/*.ipa -u $APPLE_ID -p $APP_SPECIFIC_PASSWORD"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile-app/build/ios/iphoneos/Runner.app
